name: Deploy Static HTML to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: List files (debug)
        run: ls -la

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .  # or ./public if you moved your HTML files

  deploy:
    needs: build
    runs-on: self-hosted
    environment:
      name: github-pages
      url: https://www.nainovate.ai
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Deploy
    runs-on: self-hosted

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # Ensure clean Git state
      - name: Clean workspace
        run: |
          echo "Cleaning workspace"
          sudo rm -rf "${{ github.workspace }}/*"

      # Checkout the repo properly
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: main              # Ensures we're using the main branch explicitly
          fetch-depth: 0         # Gets full git history to avoid object errors
          persist-credentials: false

      # Setup Node.js (or skip this if using another stack)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Upload the artifact for GitHub Pages deployment
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # Change this to your build output folder (e.g., ./out for Next.js, ./build for React)

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
